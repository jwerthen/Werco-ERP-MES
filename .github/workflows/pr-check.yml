name: Pull Request Check

on:
  pull_request:
    branches: [ main, develop ]
    types: [opened, synchronize, reopened]

env:
  # No PYTHON_VERSION here any more -- the removed backend-checks job's setup-python
  # step was its only consumer. This workflow is frontend-only now.
  NODE_VERSION: '22'

jobs:
  # There is deliberately NO `backend` filter here any more, and no backend job
  # below. Until 2026-08-13 this workflow carried a `backend-checks` job that ran
  # the ENTIRE backend pytest suite -- the same 5516 tests, ~38 minutes -- on
  # every PR touching backend/**, concurrently with ci-cd.yml's `backend-test`
  # job doing exactly the same work. Its lint half (black/isort/flake8/bandit)
  # was likewise a strict SUBSET of ci-cd.yml's `backend-lint`, which runs the
  # same four commands plus mypy.
  #
  # It gated nothing: the main ruleset requires exactly five contexts -- Backend
  # Tests, Backend Linting, Frontend Tests, Frontend Linting, Security Scanning
  # -- and all five come from ci-cd.yml. Nothing in this workflow is a required
  # check. So the job spent ~38 runner-minutes per backend PR duplicating a
  # verdict that could not change the merge outcome.
  #
  # The backend gate is unchanged and still blocking; it just lives in exactly
  # one place now. Do not re-add a backend job here -- pinned by
  # backend/tests/test_ci_workflow_gates.py::TestPrCheckDoesNotDuplicateTheBackendSuite.
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            frontend:
              - 'frontend/**'

  frontend-checks:
    name: Frontend Checks
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Both of these must FAIL the job. They previously ran as
      # `... 2>/dev/null || echo "completed with warnings"`: the `|| echo`
      # forced exit 0, so a real TypeScript error rendered as a green step
      # captioned "completed with warnings". The diagnostics themselves were in
      # the log the whole time -- eslint and tsc both report on stdout, which
      # was never redirected -- and counted for nothing; `2>/dev/null` hid only
      # the tools' own failure output on stderr. These are the same invocations
      # ci-cd.yml's required jobs already run; the `--` passthrough is required
      # because frontend/package.json's "lint" is a bare
      # `eslint src --ext .ts,.tsx` with no warning cap of its own.
      - name: Run ESLint
        run: npm run lint -- --max-warnings=0

      - name: TypeScript Check
        # `npm run type-check`, not a bare `npx tsc --noEmit`: the bare form
        # checks only tsconfig.json, which EXCLUDES every *.test.* / *.spec.*
        # file, src/test-utils and src/setupTests.ts. The script also runs
        # tsconfig.test.json over those, so a wrong-shaped mock fails here too.
        # Keep identical to ci-cd.yml's "Check TypeScript" step -- the comment
        # above claims both workflows run the same invocations, and a bare tsc
        # here would quietly make that false again.
        run: npm run type-check

      - name: Run Tests
        run: npm test -- --coverage --watchAll=false --passWithNoTests
        env:
          CI: true

      - name: Build Check
        run: npm run build
        env:
          CI: false
          REACT_APP_API_URL: http://localhost:8000/api/v1

  pr-summary:
    name: PR Summary
    runs-on: ubuntu-latest
    needs: [frontend-checks]
    if: always()
    steps:
      - name: Check Results
        run: |
          echo "## PR Check Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.frontend-checks.result }}" == "skipped" ]; then
            # Distinct from ✅ on purpose: a backend-only PR skips this job, and a green
            # tick against work that never ran is the fail-open APPEARANCE this repo's
            # gate tests exist to prevent -- even where, as here, nothing was gated.
            echo "⏭️ Frontend: skipped (no frontend changes)" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.frontend-checks.result }}" == "success" ]; then
            echo "✅ Frontend: ${{ needs.frontend-checks.result }}" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Frontend: ${{ needs.frontend-checks.result }}" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Backend is gated by ci-cd.yml (Backend Linting / Backend Tests), not by this workflow." >> $GITHUB_STEP_SUMMARY

      - name: Fail if checks failed
        if: needs.frontend-checks.result == 'failure'
        run: exit 1
