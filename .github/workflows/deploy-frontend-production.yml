name: Deploy Frontend Production

on:
  push:
    branches: [ main ]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend-production.yml'
      - '.github/workflows/ci-cd.yml'
  workflow_dispatch:

concurrency:
  group: deploy-frontend-production
  cancel-in-progress: true

jobs:
  deploy-frontend:
    name: Deploy Frontend (Railway Production)
    runs-on: ubuntu-latest
    env:
      # Use explicit environment secrets to avoid stale fallback tokens.
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
      RAILWAY_FRONTEND_SERVICE: ${{ vars.RAILWAY_FRONTEND_SERVICE }}
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Validate Railway token secret
        run: |
          if [ -z "${RAILWAY_TOKEN}" ]; then
            echo "RAILWAY_TOKEN is empty or missing"
            exit 1
          fi

      - name: Validate Railway project ID secret
        run: |
          if [ -z "${RAILWAY_PROJECT_ID}" ]; then
            echo "RAILWAY_PROJECT_ID is empty or missing"
            exit 1
          fi

      - name: Validate Railway token authentication
        run: |
          # Informational pre-check only. Account/workspace tokens pass `whoami`;
          # project-scoped tokens (what this workflow uses) do NOT, and the current
          # Railway CLI's `railway status` accepts no `--project` flag, so there is
          # no offline way to validate a project token here. The real gate is the
          # `railway up --project ... --service ...` step below, which is what
          # actually authenticates and authorizes against the project — so this
          # step must never hard-fail and abort the deploy.
          if railway whoami > /dev/null 2>&1; then
            echo "Railway account authentication validated via whoami."
          else
            echo "whoami did not validate (expected for a project-scoped RAILWAY_TOKEN)."
            echo "Skipping offline validation; 'railway up --project' below is the real auth check."
          fi

      # Mirrors the stamp in ci-cd.yml's deploy-production job. Vite copies
      # frontend/public/* into the build output verbatim and nginx serves it, so this
      # lands at /release.txt and makes "is production this commit?" a single GET.
      # Must stay un-gitignored (`railway up` honors .gitignore) and uncommitted.
      - name: Stamp release SHA into the frontend artifact
        run: |
          printf '%s' "$GITHUB_SHA" > frontend/public/release.txt
          echo "Stamped frontend/public/release.txt = $(cat frontend/public/release.txt)"

      # continue-on-error is deliberate; see the long note in ci-cd.yml's deploy-production
      # job. Short version: on 2026-08-04 this exact step exited 1 on a deploy that
      # shipped fine, because the CLI could not tail the build log -- its exit status
      # reports log-stream health, not deploy success. The blocking gates are the upload
      # receipt below and the release-SHA check after it.
      - name: Deploy frontend service from frontend root
        continue-on-error: true
        run: |
          set -o pipefail
          cd frontend
          service_name="${RAILWAY_FRONTEND_SERVICE:-werco-frontend}"
          railway up . --path-as-root --environment production --project "${RAILWAY_PROJECT_ID}" --service "${service_name}" | tee "$RUNNER_TEMP/deploy-frontend.log"

      - name: Confirm Railway accepted the upload
        # A "Build Logs:" URL is printed only once the upload is accepted and a build
        # queued, so its absence means the upload itself failed (bad token/project) and
        # the release poll below would only time out slowly on the same fact.
        run: |
          log="$RUNNER_TEMP/deploy-frontend.log"
          if [ ! -s "$log" ]; then
            echo "railway up produced no output -- the CLI never ran."
            exit 1
          fi
          if ! grep -q "Build Logs:" "$log"; then
            echo "railway up never reported a build -- the upload was rejected."
            echo "--- deploy log ---"
            cat "$log"
            exit 1
          fi
          echo "Railway accepted the upload and queued a build."

      - name: Verify the deployed bundle is this commit
        env:
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
        # Compared by BODY, not status code: nginx serves index.html with a 200 for any
        # unknown path, so a missing /release.txt looks like a healthy response.
        run: |
          python3 .github/scripts/verify_release.py \
            --label frontend \
            --url "${PRODUCTION_URL}/release.txt" \
            --expect "${GITHUB_SHA}"

      - name: Verify deployment serves the Vite frontend bundle
        env:
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
        run: |
          # The root must serve the Vite-built index.html and its /assets/*.js
          # bundle must be fetchable (nginx returns a real 404 for missing JS).
          # This catches the observed production failure modes: the service
          # running the wrong image (no SPA on /) or serving nothing at all.
          #
          # Freshness is NOT this step's job and never was, despite what this comment
          # used to claim ("railway up above fails the job unless the new image built and
          # deployed"). 2026-08-04 disproved that: `railway up` exited 1 on a deploy that
          # built and shipped, and it can equally exit 0 while nothing new is serving.
          # The "Verify the deployed bundle is this commit" step above owns freshness;
          # this one stays because a correct SHA still cannot prove nginx is serving JS.
          python - <<'PY'
          import os
          import re
          import sys
          import time
          import urllib.request

          base = (os.environ.get("PRODUCTION_URL") or "").strip().rstrip("/")
          if not base:
            print("PRODUCTION_URL is not configured")
            sys.exit(1)

          last_err = None

          for attempt in range(1, 13):
            try:
              with urllib.request.urlopen(base + "/", timeout=20) as resp:
                html = resp.read().decode("utf-8", "replace")
              match = re.search(r'src="(/assets/[^"]+\.js)"', html)
              if not match:
                raise RuntimeError("no /assets/*.js script tag in served index.html")
              bundle = match.group(1)
              with urllib.request.urlopen(base + bundle, timeout=20) as resp:
                ctype = resp.headers.get("Content-Type", "")
              if "javascript" not in ctype:
                raise RuntimeError(f"{bundle} served with Content-Type {ctype!r}")
              print(f"Attempt {attempt}: serving Vite bundle {bundle}")
              sys.exit(0)
            except Exception as exc:
              last_err = exc
              print(f"Attempt {attempt}: {exc}")

            time.sleep(10)

          print(f"Frontend verification failed after retries: {last_err}")
          sys.exit(1)
          PY
