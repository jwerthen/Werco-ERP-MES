name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:
    inputs:
      deploy_target:
        description: 'Deploy target (staging/production)'
        required: false
        default: 'staging'

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '22'
  RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}

jobs:
  backend-lint:
    name: Backend Linting
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run Black
        run: black --check --diff --config=.black app tests

      - name: Run isort
        run: isort --check-only --diff --settings-path=.isort.cfg app tests

      - name: Run Flake8
        run: flake8 app --max-line-length=120

      # Blocking as of 2026-08-02. This step carried `continue-on-error: true`
      # while mypy was in fact clean over all 326 source files, so the gate was
      # decoration. "Backend Linting" is a required status check, so a new
      # annotation error now blocks the merge instead of scrolling past.
      - name: Run MyPy
        run: mypy app --config-file=mypy.ini

      - name: Run Bandit security check
        run: bandit -r app -s B101 -ll

  # NO postgres service, deliberately. This suite runs on SQLite by design -- an
  # explicit owner decision (2026-08-13), now written down in docs/DEVELOPMENT.md
  # under "Why the tests run on SQLite".
  #
  # A postgres:15-alpine service used to be provisioned here and DATABASE_URL /
  # TEST_DATABASE_URL exported to the pytest step. No test ever connected to it:
  # pytest.ini carries `-n auto` unconditionally, and tests/conftest.py gives every
  # xdist worker its own SQLite database, so the `master` branch of that selection --
  # the only one that reads TEST_DATABASE_URL -- never ran. `create_engine` is lazy,
  # so nothing dialed the socket either. It cost ~21s of container startup per run to
  # provision a database the suite could not reach, while reading as though the
  # backend were tested on Postgres.
  #
  # Fidelity to production (Supabase Postgres) is bought elsewhere, on purpose: the
  # migration tests compile against a postgresql dialect, and the Alembic migrations
  # themselves run against real Postgres at DEPLOY time -- no CI job exercises them, so
  # do not read this as a CI safety net.
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      # No DATABASE_URL / TEST_DATABASE_URL here: tests/conftest.py sets both, per
      # xdist worker, before app.main is imported. Exporting a Postgres URL that
      # conftest immediately overwrites is how the misreading above survived so long.
      - name: Run pytest with coverage
        run: |
          pytest tests/ -v --cov=app --cov-report=xml --cov-report=term

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./backend/coverage.xml
          flags: backend
          fail_ci_if_error: false

  frontend-lint:
    name: Frontend Linting
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint -- --max-warnings=0

      - name: Check TypeScript
        # Must stay the npm script, never a bare `npx tsc --noEmit`: the bare
        # form only checks tsconfig.json, which EXCLUDES every *.test.* /
        # *.spec.* file, src/test-utils and src/setupTests.ts. The script also
        # runs tsconfig.test.json over those. Calling the script is what stops
        # CI and the local gate drifting apart again.
        run: npm run type-check

  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --coverage --watchAll=false
        env:
          CI: true

  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [backend-lint, backend-test, frontend-lint, frontend-test]
    if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build backend image
        run: |
          docker build -t werco-erp-backend:${{ github.sha }} ./backend
          docker build -t werco-erp-backend:latest ./backend

      - name: Build frontend image
        env:
          REACT_APP_API_URL: http://localhost:8000/api/v1
        run: |
          docker build --build-arg REACT_APP_API_URL="$REACT_APP_API_URL" -t werco-erp-frontend:${{ github.sha }} ./frontend
          docker build --build-arg REACT_APP_API_URL="$REACT_APP_API_URL" -t werco-erp-frontend:latest ./frontend

      - name: Test Docker Compose
        # docker-compose.yml uses required-variable interpolation (e.g. ${DATABASE_URL:?...}).
        # These placeholders only satisfy `config`'s static interpolation check; they are not
        # real secrets and are never used to start a container.
        env:
          DATABASE_URL: postgresql://ci_validation:ci_validation@localhost:5432/ci_validation
          SECRET_KEY: ci-config-validation-placeholder-not-a-secret
          REFRESH_TOKEN_SECRET_KEY: ci-config-validation-placeholder-not-secret
        run: docker compose config -q

  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    # No `needs:` — this is cheap and should report even if the build is broken.
    #
    # Added 2026-07-28. Until then the repo had no ENFORCING secret-detection
    # gate: the only dedicated control was `detect-private-key` in
    # .pre-commit-config.yaml, and that file was invalid YAML so pre-commit
    # could never load it (see the note at the top of that file). Running the
    # hook here rather than trusting a local `pre-commit install` makes it
    # enforced for every contributor.
    #
    # (Trivy's fs scan in the security-scan job does enable its secret scanner
    # by default, but it blocks nothing: the backend SARIF upload is
    # continue-on-error, the frontend SARIF is never uploaded, and it covers
    # only backend/ and frontend/ — not the repo root or .github/.)
    #
    # Scope honesty: `detect-private-key` finds PRIVATE KEY blocks, not API
    # tokens, passwords, or connection strings. It is a floor, not full secret
    # scanning — GitHub secret scanning or gitleaks would be the next step, and
    # that is a deliberate open decision, not an oversight.
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Scan all files for committed private keys
        run: |
          pip install pre-commit
          pre-commit run detect-private-key --all-files

  security-scan:
    name: Security Scanning
    runs-on: ubuntu-latest
    needs: [build]
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - name: Run Trivy vulnerability scanner (Backend)
        # Pinned, not @master: a floating branch ref runs whatever upstream
        # pushed, in a job that holds `security-events: write`. Bump deliberately.
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: './backend'
          format: 'sarif'
          output: 'backend-trivy-results.sarif'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        # Non-fatal: the SARIF upload needs code scanning (GitHub Advanced Security),
        # which fails on push if unavailable. The Trivy scan still runs (informational).
        # NOTE (2026-07-28): nothing in this job blocks any more — npm audit became
        # advisory here too. The blocking dependency gate now lives in
        # .github/workflows/dependency-audit.yml (nightly). See the npm audit step below.
        continue-on-error: true
        with:
          sarif_file: 'backend-trivy-results.sarif'

      - name: Run Trivy vulnerability scanner (Frontend)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: './frontend'
          format: 'sarif'
          output: 'frontend-trivy-results.sarif'

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
        # No `cache: 'npm'`: this job has no defaults.working-directory, so the
        # cache-dependency glob would resolve from the repo root (no lockfile
        # there). Same trap documented on setup-python below. Nothing is
        # installed here anyway — see the next step.

      - name: Run npm audit (Frontend)
        working-directory: ./frontend
        # Allowlist-aware wrapper around `npm audit --json`.
        #
        # ADVISORY HERE (changed 2026-07-28), BLOCKING NIGHTLY. This job sits in
        # the `needs` chain of deploy-production, so while this step was a hard
        # gate a newly-published advisory could red-line unrelated PRs *and*
        # block prod deploys with zero code change (the 2026-07-20 axios
        # incident, PR #138; react-router was the second occurrence). The
        # advisory database is a daily-moving target and does not belong on the
        # critical path of shipping unrelated work — the same reasoning already
        # applied to pip-audit below.
        #
        # The gate itself is NOT gone: .github/workflows/dependency-audit.yml
        # runs this exact command nightly and hard-fails there, so a real
        # advisory still turns something red and is visible in the Actions tab.
        # Promote back to blocking by deleting `continue-on-error` here.
        # Verified to need no `npm ci` — `npm audit` resolves the tree from
        # package-lock.json alone, so the checkout is sufficient.
        # See docs/SECURITY_ADVISORY_SUPPRESSIONS.md.
        continue-on-error: true
        run: npm run audit:ci

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
        # No `cache: 'pip'` here: this job has no defaults.working-directory, so
        # setup-python would resolve the pip-cache hash glob from the repo root
        # (no requirements file there) and fail the step. The step only installs
        # pip-audit anyway, so a pip cache buys nothing.

      - name: Run pip-audit (Backend dependency scan)
        working-directory: ./backend
        # Scans the APP's resolved dependency tree (`-r` requirements files), not
        # the runner's ambient system Python. The previous `safety check` (no -r)
        # scanned the runner image's pre-installed packages + safety's own deps,
        # producing dozens of phantom advisories unrelated to this app.
        #
        # Advisory only (continue-on-error): the public advisory DB is a
        # daily-moving target, so this gate is informational rather than blocking
        # (a hard gate would flap red on every unrelated PR). Backend dependency
        # CVEs are remediated as ongoing security hygiene.
        #
        # --ignore-vuln PYSEC-2026-1325 mirrors the BLOCKING copy of this scan in
        # dependency-audit.yml, so the two invocations can't drift and this log
        # stops re-reporting a finding we've formally accepted. It is the
        # "Minerva" P-256 timing side-channel in `ecdsa` 0.19.2: no upstream fix
        # exists or is planned, it is only present transitively via
        # `python-jose[cryptography]`, and the path is structurally unreachable
        # (the cryptography backend always wins because `cryptography` is pinned
        # directly, so `ecdsa` is never imported; this app is HS256-only).
        # Guarded by backend/tests/test_jose_ec_backend_guard.py.
        # See docs/SECURITY_ADVISORY_SUPPRESSIONS.md.
        continue-on-error: true
        run: |
          pip install pip-audit==2.10.0
          pip-audit -r requirements.txt -r requirements-dev.txt \
            --ignore-vuln PYSEC-2026-1325

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [security-scan]
    if: github.ref == 'refs/heads/develop'
    environment:
      name: staging
      url: ${{ vars.STAGING_URL }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy Backend to Staging
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          cd backend
          railway up --service werco-api-staging . --path-as-root --environment staging --project "${{ secrets.RAILWAY_PROJECT_ID }}"

      - name: Deploy Frontend to Staging
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          cd frontend
          railway up --service werco-frontend-staging . --path-as-root --environment staging --project "${{ secrets.RAILWAY_PROJECT_ID }}"

      # ARQ background worker. GATED and OFF by default: set the repo variable
      # DEPLOY_WORKER_STAGING=true (Settings -> Secrets and variables -> Actions ->
      # Variables) only AFTER the werco-worker-staging service exists. Until then the step
      # is skipped, so merging this workflow deploys nothing new.
      #
      # Deployed from the REPO ROOT, not backend/ -- that is what stops it inheriting
      # backend/railway.toml's healthcheckPath="/health", which an arq worker can never
      # satisfy. See the repo-root railway.toml. There is no health verification step for
      # the worker because it serves no HTTP; verify it from its startup log instead
      # (docs/WORKER_SERVICE.md).
      - name: Deploy Worker to Staging
        if: vars.DEPLOY_WORKER_STAGING == 'true'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          railway up --service werco-worker-staging . --path-as-root --environment staging --project "${{ secrets.RAILWAY_PROJECT_ID }}"

      - name: Verify Staging Deployment
        run: |
          for i in 1 2 3 4 5; do
            sleep 15
            if curl -sf ${{ vars.STAGING_API_URL }}/health; then
              echo "Staging deployment healthy"
              exit 0
            fi
            echo "Attempt $i failed, retrying..."
          done
          echo "Staging deployment health check failed after 5 attempts"
          exit 1

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [security-scan]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    # Production deploys must not overlap, and the exact-SHA gate below is what makes
    # that load-bearing rather than merely tidy. Railway keeps ONE active deployment per
    # service, so if two deploy jobs run at once only one run's SHA is ever live -- the
    # loser then polls for a SHA that will never appear, burns its full timeout, exits 1,
    # and skips verify_launch and the release tag. That is the exact symptom this whole
    # change exists to remove. The old `curl /health` check never noticed, because any
    # answering container satisfied it.
    #
    # This repo merges in bursts (five commits landed on main inside 63 seconds on
    # 2026-08-02), so the overlap is routine, not theoretical.
    #
    # cancel-in-progress: false, deliberately -- an in-flight production deploy is never
    # killed half-way. GitHub still keeps only the MOST RECENT pending run per group and
    # cancels superseded ones, so a burst settles as "first run completes, intermediates
    # are cancelled (not failed), last run deploys the tip" -- which is what we want.
    # The group is shared with deploy-frontend-production.yml so the two workflows cannot
    # deploy werco-frontend simultaneously either.
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    # contents: write is needed by the Create GitHub Release step; the repo's
    # default workflow token permission is read-only.
    permissions:
      contents: write
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      # Stamp the commit SHA into the artifact BEFORE it is uploaded. app/core/config.py
      # reads backend/RELEASE into APP_RELEASE, which is reported to Sentry (`release`)
      # and by /health/detailed (checks.application.release) -- so "is commit X actually
      # deployed?" is one curl instead of cross-referencing Actions and the Railway API.
      #
      # Deliberately NOT `railway variables --set APP_RELEASE=...`: a service variable is
      # set independently of the build, so it would keep advertising the SHA this job
      # *attempted* even when `railway up` failed or an older image was rolled back --
      # reporting the wrong commit is worse than reporting none. (It would also cost a
      # second deploy per push unless `--skip-deploys` is passed, and the CLI here is
      # installed unpinned, so its flag set can change under us.) A file inside the
      # uploaded source cannot drift from the code it ships with.
      #
      # `railway up` honors .gitignore when selecting files to upload: keep backend/RELEASE
      # OUT of .gitignore or this silently stops shipping.
      - name: Stamp release SHA into the backend artifact
        run: |
          printf '%s' "$GITHUB_SHA" > backend/RELEASE
          echo "Stamped backend/RELEASE = $(cat backend/RELEASE)"

      # The frontend's half of the same contract. It had no way to report what it was
      # running, so "is the deployed SPA this commit?" was unanswerable and the deploy
      # was verified by "does / return an HTML page" -- which the OLD container answers
      # just as well. Vite copies frontend/public/* into the build output verbatim and
      # nginx serves it, so this lands at /release.txt.
      #
      # Same two rules as backend/RELEASE, guarded by the same tests: it must NOT be
      # gitignored (`railway up` honors .gitignore, so ignoring it silently stops it
      # shipping) and must NOT be committed (a committed SHA would go stale and keep
      # reporting the wrong commit -- worse than reporting none).
      - name: Stamp release SHA into the frontend artifact
        run: |
          printf '%s' "$GITHUB_SHA" > frontend/public/release.txt
          echo "Stamped frontend/public/release.txt = $(cat frontend/public/release.txt)"

      # WHY continue-on-error, AND WHY IT IS NOT A SWALLOWED FAILURE.
      # `railway up`'s exit status answers "could the CLI tail the build log?", not "did
      # the deploy land?". On 2026-08-04 it exited 1 on two consecutive production
      # deploys (#198, #203) with "Failed to stream build logs" ~66s after an upload that
      # Railway accepted, built, and shipped. Because a failed step skips the rest of the
      # job, that ALSO skipped the frontend deploy, the worker deploy, verify_launch and
      # the release tag -- production ran two commits that the release history denied.
      #
      # So the exit status is demoted to advisory (still streamed here, still visible in
      # the UI as a distinct outcome) and the job is gated on two blocking steps instead:
      # the upload receipt immediately below, and "Verify production is serving this
      # commit", which polls the running service for the SHA stamped above. That gate is
      # strictly stronger than the exit status it replaces -- it cannot pass unless the
      # new image is actually serving traffic.
      - name: Deploy Backend to Production
        continue-on-error: true
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          set -o pipefail
          cd backend
          railway up --service werco-api . --path-as-root --environment production --project "${{ secrets.RAILWAY_PROJECT_ID }}" | tee "$RUNNER_TEMP/deploy-backend.log"

      - name: Confirm Railway accepted the backend upload
        # Fails FAST on the one thing the CLI's exit status was genuinely good for: a bad
        # token or project ID means no build is ever created, and without this the job
        # would instead sit in the release poll below for its full timeout before saying
        # so. The CLI prints a "Build Logs:" URL only once the upload is accepted and a
        # build queued, which makes its presence an honest upload receipt.
        run: |
          log="$RUNNER_TEMP/deploy-backend.log"
          if [ ! -s "$log" ]; then
            echo "railway up produced no output for werco-api -- the CLI never ran."
            exit 1
          fi
          if ! grep -q "Build Logs:" "$log"; then
            echo "railway up never reported a build for werco-api -- the upload was rejected."
            echo "--- deploy log ---"
            cat "$log"
            exit 1
          fi
          echo "Railway accepted the backend upload and queued a build."

      - name: Deploy Frontend to Production
        continue-on-error: true
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          set -o pipefail
          cd frontend
          railway up --service werco-frontend . --path-as-root --environment production --project "${{ secrets.RAILWAY_PROJECT_ID }}" | tee "$RUNNER_TEMP/deploy-frontend.log"

      - name: Confirm Railway accepted the frontend upload
        run: |
          log="$RUNNER_TEMP/deploy-frontend.log"
          if [ ! -s "$log" ]; then
            echo "railway up produced no output for werco-frontend -- the CLI never ran."
            exit 1
          fi
          if ! grep -q "Build Logs:" "$log"; then
            echo "railway up never reported a build for werco-frontend -- the upload was rejected."
            echo "--- deploy log ---"
            cat "$log"
            exit 1
          fi
          echo "Railway accepted the frontend upload and queued a build."

      # ARQ background worker. GATED and OFF by default: set the repo variable
      # DEPLOY_WORKER_PRODUCTION=true only AFTER the werco-worker service exists AND its
      # variables are set (REDIS_URL above all -- the worker refuses to start without a real
      # Redis target). Until then this step is skipped and production is untouched.
      #
      # Runs AFTER the RELEASE stamp step above so backend/RELEASE ships in the worker's
      # upload too and its Sentry events carry the same release tag as the API's.
      #
      # Deployed from the REPO ROOT so it reads the repo-root railway.toml (no
      # healthcheckPath) instead of backend/railway.toml (healthcheckPath="/health", which
      # an arq worker can never satisfy). See the repo-root railway.toml header.
      - name: Deploy Worker to Production
        if: vars.DEPLOY_WORKER_PRODUCTION == 'true'
        continue-on-error: true
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          set -o pipefail
          railway up --service werco-worker . --path-as-root --environment production --project "${{ secrets.RAILWAY_PROJECT_ID }}" | tee "$RUNNER_TEMP/deploy-worker.log"

      # The worker serves no HTTP, so the upload receipt is the only gate available to
      # CI -- there is nothing to poll for a release SHA. Confirm it from the service's
      # startup log instead (docs/WORKER_SERVICE.md). Carries the same `if:` as the step
      # above so it stays skipped, rather than failing on a missing log, while the worker
      # deploy is still gated off.
      - name: Confirm Railway accepted the worker upload
        if: vars.DEPLOY_WORKER_PRODUCTION == 'true'
        run: |
          log="$RUNNER_TEMP/deploy-worker.log"
          if [ ! -s "$log" ]; then
            echo "railway up produced no output for werco-worker -- the CLI never ran."
            exit 1
          fi
          if ! grep -q "Build Logs:" "$log"; then
            echo "railway up never reported a build for werco-worker -- the upload was rejected."
            echo "--- deploy log ---"
            cat "$log"
            exit 1
          fi
          echo "Railway accepted the worker upload and queued a build."

      # THE gate for this job, and the reason the deploy steps above can be advisory.
      #
      # What this replaced: a loop that curl'd /health and passed the moment anything
      # answered. The OLD container answers /health perfectly, so the check proved the
      # site was up and never that the deploy had landed -- it would have gone green
      # throughout the 2026-08-04 incident had it been reached at all.
      #
      # Each poll compares the SHA baked into the artifact against the SHA this run
      # deployed, so it can only pass once the new image is serving traffic. The frontend
      # marker is compared by BODY, not status code: nginx's SPA fallback returns 200
      # with index.html for a missing /release.txt, so a status check would pass when the
      # marker was never deployed at all.
      - name: Verify production is serving this commit
        env:
          PRODUCTION_API_URL: ${{ vars.PRODUCTION_API_URL }}
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
        run: |
          python3 .github/scripts/verify_release.py \
            --label backend \
            --url "${PRODUCTION_API_URL}/health/detailed" \
            --json-path checks.application.release \
            --expect "${GITHUB_SHA}"
          python3 .github/scripts/verify_release.py \
            --label frontend \
            --url "${PRODUCTION_URL}/release.txt" \
            --expect "${GITHUB_SHA}"

      - name: Verify Production Config
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        # verify_launch imports app.core.config, so it needs the backend deps
        # and backend/ as the working directory. `railway run` executes the
        # command LOCALLY with the service's variables injected; --no-local
        # stops it from rewriting internal hostnames (e.g. DATABASE_URL) for
        # local development, which would trip the script's sanity checks.
        run: |
          cd backend
          python3 -m pip install -q -r requirements.txt
          railway run --no-local --service werco-api --environment production --project "${{ secrets.RAILWAY_PROJECT_ID }}" python3 -m scripts.verify_launch

      - name: Create GitHub Release
        if: success()
        # The archived actions/create-release@v1 stopped working when GitHub
        # runners flipped the default action runtime Node 20 -> Node 24
        # (2026-07-10, run 29124478242: healthy deploy marked red by this step
        # alone). Use the preinstalled gh CLI instead. Release bookkeeping is
        # best-effort: continue-on-error so it can never fail a successful
        # deploy. --target pins the tag to the deployed commit even if main
        # has advanced by the time the deploy finishes.
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "deploy-${{ github.run_number }}" \
            --target "${{ github.sha }}" \
            --title "Production Deploy" \
            --notes "$(printf 'Automated production deployment\nCommit: %s\nDeployed by: %s' "${{ github.sha }}" "${{ github.actor }}")"

  notify:
    name: Notify Results
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test, security-scan]
    if: always()
    steps:
      - name: Send notification
        run: |
          if [ "${{ needs.backend-test.result }}" == "failure" ] || [ "${{ needs.frontend-test.result }}" == "failure" ]; then
            echo "Pipeline failed - notification would be sent"
          else
            echo "Pipeline succeeded - notification would be sent"
          fi
