[pytest]
pythonpath = .
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    --verbose
    --strict-markers
    --tb=short
    --cov=app
    --cov-report=term-missing
    --cov-report=html
    --cov-fail-under=50
    -n auto
    -m "not evals"
markers =
    unit: Unit tests
    integration: Integration tests
    api: API endpoint tests
    slow: Slow running tests
    requires_db: Tests that require database
    evals: AI eval harness (excluded from the default run; run with `pytest -m evals tests/evals`)
asyncio_mode = auto
filterwarnings =
    ignore::DeprecationWarning
    # starlette >=1.3 raises its deprecations as StarletteDeprecationWarning,
    # which subclasses UserWarning and NOT DeprecationWarning (deliberately, so
    # they stay visible by default) — so the line above does not match them.
    # This one fires once per test module that imports TestClient (~150 times)
    # from fastapi/testclient.py:1, and is test-tooling noise, not app code:
    # migrating off httpx onto httpx2 is a separate change (httpx==0.28.1 is
    # pinned). Scoped to this exact message on purpose — a blanket
    # `ignore::...StarletteDeprecationWarning` would also hide the other five
    # deprecations starlette can raise (run_until_first_complete, generator
    # lifespans, TestClient `timeout=`, status-code renames, middleware.wsgi).
    # Two of those five ARE currently firing and are deliberately left visible:
    # HTTP_422_UNPROCESSABLE_ENTITY -> HTTP_422_UNPROCESSABLE_CONTENT (9 uses in
    # app/, 98 in tests/) and HTTP_413_REQUEST_ENTITY_TOO_LARGE ->
    # HTTP_413_CONTENT_TOO_LARGE (1 use in tests/). Those are real renames in our
    # own code, not tooling noise — fix them, don't add them here.
    ignore:Using `httpx` with `starlette\.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning
